<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header-container">
        
            <div class="img-section">
                <img class="headimg" src="https://cdn-icons-png.flaticon.com/128/12259/12259288.png">
            </div>
            <h3 class="headName">Recipe Finder</h3>       
             
    </div>
    <div class="msg-section">
        <p class="headMsg">No Clue What to Cook? We’ve Got You!</p> 

    </div>
        
    <div class="search-container">
        <input type="text" class="searchBar" placeholder="Search recipes...">
        <button class="searchBtn">Search</button>
    </div>
    <div class="error-container">
        <p class="resultMsg"></p>
    </div>
    <div class="recipe-container">
        

    </div>
    
    <div class="reciprdtls-container">
        <div class="recipeDtls">
            <div class="recipeImgBox">
                <img class="recipeDtlsImg">
            </div>

        </div>
         <p class="recipe-Name"></p>
         <h3 class="instructions"></h3>
        <div class="recipeDtls">
           <p class="mealInstructions"></p>
        </div>
        <h3 class="ingredient"></h3>
        <div class="ingredientsBox">
           
           

        </div>
         <a class="ytubeLink" target="_blank"> 
            <div class="ytubeBox"></div>                
         </a>
         
    </div>
 <script src="script.js"></script>
</body>

</html>
