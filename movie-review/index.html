<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moviereview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topBlock">
        <h1 class="headline">CineScope</h1>
        <input class="searchBox" type ="text" placeholder="Search movies...">
        <button class="searchButton">
            <img class="searchImg" src="https://img.icons8.com/?size=60&id=59878&format=png" alt="">
        </button>
    </div>
    <div class="languageBox">
       <button class="languageBtn" >All</button> 
       <button class="languageBtn" value="en">English</button> 
       <button class="languageBtn" value="hi">Hindi</button> 
       <button class="languageBtn" value="ml">Malayalam</button> 
       <button class="languageBtn" value="ta">Tamil</button> 
       <button class="languageBtn" value="te">Telugu</button> 
    </div>
    <div class="mainContainer">
        
        
      
       
    </div>
     <div class="pageChange">
           
            <button class="prevButton">Prev</button>
            <input class="pageNumber" type="text">
            <button class="nextButton">Next</button>
    </div>
    
    <script  src="script.js"></script>
   
</body>
</html>
